[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earshot"
version = "0.1.0"
description = "Every voice at the table, captioned — even when people talk at once."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "openai>=1.60",          # client for Meta's OpenAI-compatible Model API
    "meta_sam_parser>=0.1",  # Meta's parser for SAM 3.1 output (SAM License)
]

[project.optional-dependencies]
# Local voice separation with Meta's SAM Audio. See README "Install SAM Audio".
separation = ["torch", "torchaudio", "torchvision", "torchcodec", "transformers>=4.54", "einops", "torchdiffeq"]
dev = ["pytest>=8"]

[project.scripts]
earshot = "earshot.cli:main"

[tool.setuptools.packages.find]
include = ["earshot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
